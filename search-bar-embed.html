<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salisbury Address Search</title>
<style>
  :root {
    --sby-brown: #6e5d50;
    --sby-orange: #f5a623;
    --sby-green-light: #8dc63f;
    --sby-green: #1f9c53;
    --sby-blue-light: #29abe2;
    --sby-blue: #0072bc;
    --ink: #2c2620;
    --muted: #8a7f74;
    --border: #e7e1da;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .card {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px 20px;
    overflow: hidden;
  }
  .wave-bg {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 70px;
    opacity: 0.16;
    pointer-events: none;
  }
  .brand-row {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    color: var(--sby-brown);
    margin: 0;
  }
  .brand-sub {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .search-box { position: relative; }
  .search-input-row {
    display: flex;
    align-items: center;
    background: #fafaf8;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 4px 4px 4px 16px;
    transition: border-color 0.15s;
  }
  .search-input-row:focus-within {
    border-color: var(--sby-blue-light);
    background: white;
  }
  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px 6px;
    font-size: 14px;
    color: var(--ink);
  }
  input::placeholder { color: var(--muted); }
  button.search-btn {
    border: none;
    background: var(--sby-blue);
    color: white;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.search-btn:hover { background: #005b96; }
  button.search-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

  .suggestions {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: none;
    background: white;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 11px 16px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.active { background: #f4f8fb; }
  .suggestion .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--sby-green-light);
    flex-shrink: 0;
  }
  .suggestion .addr { color: var(--ink); }
  .empty {
    padding: 12px 16px;
    color: var(--muted);
    font-size: 13px;
  }

  .footnote {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <svg class="wave-bg" viewBox="0 0 480 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,55 C60,25 120,25 180,45 C240,65 300,20 360,35 C410,47 450,30 480,20" stroke="var(--sby-blue)" stroke-width="5" fill="none"/>
    <path d="M0,45 C60,15 120,15 180,35 C240,55 300,10 360,25 C410,37 450,20 480,10" stroke="var(--sby-green)" stroke-width="5" fill="none"/>
    <path d="M60,20 C110,-5 160,-5 210,15 C250,30 290,0 330,10" stroke="var(--sby-orange)" stroke-width="5" fill="none"/>
  </svg>

  <div class="brand-row">
    <h1 class="brand-title">Salisbury</h1>
    <span class="brand-sub">Address Lookup</span>
  </div>

  <div class="search-box">
    <div class="search-input-row">
      <input type="text" id="addr-input" placeholder="Search your address" autocomplete="off">
      <button class="search-btn" id="go-btn" disabled>Search</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="footnote">Find your council district, polling place, zoning and more.</div>
</div>
