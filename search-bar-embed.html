<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salisbury Address Search</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
  }
  .search-wrap {
    width: 100%;
  }
  .blue-box {
    background: #0B77BC;
    border: 1px solid #0B77BC;
    padding: 16px 18px 18px;
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-img {
    height: 110px;
    flex-shrink: 0;
  }
  .search-box { position: relative; flex: 1; align-self: center; }
  .search-input-row {
    display: flex;
    align-items: center;
    background: white;
    height: 42px;
    padding: 0 14px;
  }
  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 0 6px;
    font-size: 14px;
    color: #2c2c2c;
    font-family: Arial, Helvetica, sans-serif;
  }
  input::placeholder { color: #7a7a7a; }
  .search-icon {
    color: #0B77BC;
    font-size: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .suggestions {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #d9d9d9;
    display: none;
    z-index: 10;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 11px 14px;
    cursor: pointer;
    font-size: 14px;
    color: #2c2c2c;
    border-bottom: 1px solid #eee;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.active { background: #eaf3fb; }
  .empty {
    padding: 11px 14px;
    color: #8a8a8a;
    font-size: 13px;
  }

  .footnote {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    font-style: italic;
    color: #F5B333;
    text-align: center;
  }
</style>
</head>
