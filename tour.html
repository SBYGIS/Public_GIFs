<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salisbury OneMap Tour</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #004676;
    --blue:   #005e9c;
    --light:  #e8f1f8;
    --white:  #ffffff;
    --border: #dde8f0;
    --text:   #2a2a2a;
    --muted:  #6b7a8a;
    --shadow: 0 4px 28px rgba(0,70,118,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .map-wrapper {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #mapFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Light tint only — no blur */
  .tour-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,15,35,0.22);
    z-index: 80;
  }
  .tour-overlay.active { display: block; }

  /* ── Beacons ── */
  .beacon {
    display: none;
    position: absolute;
    z-index: 100;
    cursor: pointer;
    transform: translate(-50%, -50%);
    width: 38px; height: 38px;
  }
  .beacon.visible { display: block; }

  .beacon-core {
    position: relative;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
  }

  .beacon-dot {
    width: 38px; height: 38px;
    background: var(--navy);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    color: #fff;
    position: relative;
    z-index: 2;
    box-shadow: 0 2px 14px rgba(0,70,118,0.55);
    transition: transform 0.15s;
    border: 2.5px solid rgba(255,255,255,0.85);
    font-family: 'Montserrat', sans-serif;
  }
  .beacon:hover .beacon-dot {
    transform: scale(1.18);
    background: var(--blue);
  }

  .ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    background: rgba(0,70,118,0.18);
    transform: translate(-50%, -50%);
    animation: ringOut 2s ease-out infinite;
  }
  .ring:nth-child(2) { animation-delay: 0.65s; }
  .ring:nth-child(3) { animation-delay: 1.3s; }

  @keyframes ringOut {
    0%   { width: 38px; height: 38px; opacity: 0.9; }
    100% { width: 82px; height: 82px; opacity: 0; }
  }

  /* ── Tooltip — matches address popup style ── */
  .tour-tip {
    display: none;
    position: absolute;
    z-index: 110;
    width: 290px;
    background: var(--white);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: tipIn 0.22s cubic-bezier(0.34,1.56,0.64,1);
    border: 1px solid var(--border);
  }
  .tour-tip.visible { display: block; }

  @keyframes tipIn {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Header matches address popup navy header */
  .tip-header {
    background: var(--navy);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .tip-icon { font-size: 1.1rem; }

  .tip-title {
    font-family: 'Montserrat', sans-serif;
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .tip-counter {
    margin-left: auto;
    font-size: 0.58rem;
    color: rgba(255,255,255,0.6);
    font-family: 'Montserrat', sans-serif;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  /* Body matches popup card white bg */
  .tip-body {
    padding: 13px 16px 6px;
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--text);
    font-weight: 400;
  }

  /* Callout matches popup section style */
  .tip-callout {
    margin: 10px 0 6px;
    padding: 9px 12px;
    background: var(--light);
    border-left: 3px solid var(--blue);
    border-radius: 0 5px 5px 0;
    font-size: 0.7rem;
    color: var(--navy);
    line-height: 1.5;
    font-weight: 500;
  }

  .tip-footer {
    padding: 10px 16px 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  .tip-close {
    font-size: 0.62rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    text-decoration: underline;
    font-weight: 500;
  }
  .tip-close:hover { color: var(--navy); }

  .tip-next {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 7px 18px;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    transition: background 0.15s;
    letter-spacing: 0.02em;
  }
  .tip-next:hover { background: var(--blue); }

  /* ── Highlight ring ── */
  .hl-ring {
    display: none;
    position: absolute;
    border: 2.5px solid var(--blue);
    border-radius: 6px;
    pointer-events: none;
    z-index: 90;
    box-shadow: 0 0 0 4px rgba(0,94,156,0.18);
    transition: all 0.3s cubic-bezier(0.34,1.2,0.64,1);
  }
  .hl-ring.visible { display: block; }

  /* ── Intro card — matches popup style ── */
  .intro-card {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 120;
    background: var(--white);
    border-radius: 10px;
    padding: 0;
    max-width: 360px;
    width: 90%;
    box-shadow: var(--shadow);
    text-align: center;
    animation: tipIn 0.3s ease;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .intro-card.visible { display: block; }

  .intro-header {
    background: var(--navy);
    padding: 20px 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .intro-logo {
    width: 54px; height: 54px;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }

  .intro-header h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .intro-header p {
    font-size: 0.68rem;
    color: rgba(255,255,255,0.65);
    font-weight: 400;
  }

  .intro-body {
    padding: 16px 20px 20px;
  }

  .intro-body p {
    font-size: 0.76rem;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 14px;
    font-weight: 400;
  }

  .beacon-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.7rem;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 16px;
    background: var(--light);
    padding: 9px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    text-align: left;
  }

  .sample-beacon {
    width: 28px; height: 28px;
    background: var(--navy);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,70,118,0.3);
  }

  .intro-start {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 28px;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    transition: all 0.15s;
    width: 100%;
    letter-spacing: 0.03em;
  }
  .intro-start:hover { background: var(--blue); }

  /* ── Exit button — big, obvious, floating ── */
  .exit-btn {
    display: none;
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 105;
    background: var(--white);
    color: var(--navy);
    border: 2px solid var(--navy);
    border-radius: 8px;
    padding: 13px 36px;
    font-size: 0.82rem;
    font-weight: 700;
    font-family: 'Montserrat', sans-serif;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.04em;
    box-shadow: var(--shadow);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .exit-btn:hover {
    background: var(--navy);
    color: #fff;
    transform: translateX(-50%) translateY(-2px);
  }
  .exit-btn.visible { display: block; }

  @media (max-width: 480px) {
    .tour-tip { width: 252px; }
    .exit-btn { bottom: 16px; padding: 11px 28px; font-size: 0.75rem; }
  }
</style>
</head>
<body>

<div class="map-wrapper" id="mapWrapper">

  <iframe
    id="mapFrame"
    src="https://experience.arcgis.com/experience/8f9ed0ab14e7478ba80c577ede8fb543/"
    title="Salisbury OneMap"
    allowfullscreen>
  </iframe>

  <div class="tour-overlay" id="tourOverlay"></div>
  <div class="hl-ring" id="hlRing"></div>

  <!-- 7 Beacons -->
  <div class="beacon" id="b0" onclick="openTip(0)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">1</div></div></div>
  <div class="beacon" id="b1" onclick="openTip(1)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">2</div></div></div>
  <div class="beacon" id="b2" onclick="openTip(2)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">3</div></div></div>
  <div class="beacon" id="b3" onclick="openTip(3)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">4</div></div></div>
  <div class="beacon" id="b4" onclick="openTip(4)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">5</div></div></div>
  <div class="beacon" id="b5" onclick="openTip(5)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">6</div></div></div>
  <div class="beacon" id="b6" onclick="openTip(6)"><div class="beacon-core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="beacon-dot">7</div></div></div>

  <!-- Tooltip -->
  <div class="tour-tip" id="tourTip">
    <div class="tip-header">
      <span class="tip-icon" id="tipIcon">🔍</span>
      <span class="tip-title" id="tipTitle">Search</span>
      <span class="tip-counter" id="tipCounter">1 / 7</span>
    </div>
    <div class="tip-body">
      <div id="tipBody"></div>
      <div class="tip-callout" id="tipCallout"></div>
    </div>
    <div class="tip-footer">
      <button class="tip-close" onclick="closeTip()">Close</button>
      <button class="tip-next" id="tipNext" onclick="nextTip()">Next →</button>
    </div>
  </div>

  <!-- Intro card -->
  <div class="intro-card" id="introCard">
    <div class="intro-header">
      <img
        class="intro-logo"
        src="https://salisbury.maps.arcgis.com/sharing/rest/content/items/5390374232b241d5991cdb06c32e3640/data"
        alt="City of Salisbury"
        onerror="this.style.display='none'">
      <h2>Salisbury OneMap</h2>
      <p>City of Salisbury, Maryland</p>
    </div>
    <div class="intro-body">
      <p>This interactive map brings City data together in one place — from zoning and floodplains to trash pickup days and polling locations.</p>
      <div class="beacon-hint">
        <div class="sample-beacon">1</div>
        <span>Tap the numbered markers to learn about each tool</span>
      </div>
      <button class="intro-start" onclick="showBeacons()">Start the Tour →</button>
    </div>
  </div>

  <!-- Exit button -->
  <a
    class="exit-btn"
    id="exitBtn"
    href="https://experience.arcgis.com/experience/8f9ed0ab14e7478ba80c577ede8fb543/"
    target="_top">
    ← Exit Tour &amp; Return to OneMap
  </a>

</div>

<script>
let tourActive = false;
let currentTip = -1;

const stops = [
  {
    icon: '🔍',
    title: 'Address Search',
    body: 'Type any Salisbury address to instantly generate a full property report — your City Council district and representative, trash pickup day, zoning, floodplain status, police sector, fire station, polling location, and more.',
    callout: '💡 This is the fastest way to answer "what city services apply to my address?" — all from a single search.',
    pos: { desk: [72, 6], mob: [72, 8] }
  },
  {
    icon: '🗂',
    title: 'Layer Categories',
    body: 'These buttons filter the layer list by topic — Infrastructure, Planning, Environment, Safety, and Community. They help you find layers faster without scrolling the full list.',
    callout: '💡 Categories filter the list only — they do not turn layers on automatically. Check the box next to a layer to display it on the map.',
    pos: { desk: [13, 9], mob: [50, 93] }
  },
  {
    icon: '📋',
    title: 'Layer List',
    body: 'Check any layer\'s box to show it on the map. Some layers only appear at closer zoom levels — if a layer isn\'t showing after you check it, try zooming in.',
    callout: '💡 Click ··· next to any layer for extra options: zoom to it, adjust transparency, set a filter, or export data.',
    pos: { desk: [11, 46], mob: [11, 55] }
  },
  {
    icon: '🔖',
    title: 'Menu & Bookmarks',
    body: 'The menu in the top-right contains curated Bookmarks — these go further than categories. A bookmark zooms you to a specific area AND automatically turns on the relevant layers.',
    callout: '💡 If you\'re not sure where to start, bookmarks are the quickest way to jump into a topic without configuring anything manually.',
    pos: { desk: [98, 4], mob: [90, 4] }
  },
  {
    icon: '🛠',
    title: 'Map Tools',
    body: 'The right toolbar gives you powerful tools: Draw to sketch on the map, Measure distances and areas, Elevation Profile along any path, and Coordinates to identify any location.',
    callout: '💡 Use the Share tool to copy a URL that preserves exactly what you\'re looking at — the view, active layers, and location.',
    pos: { desk: [98, 48], mob: null }
  },
  {
    icon: '📊',
    title: 'Data Table',
    body: 'See the small arrow at the bottom center of the map? Click it to open a data drawer with a full table of records from your visible layers — great for browsing, sorting, and reviewing multiple features at once.',
    callout: '💡 The table updates based on what layers are turned on and what\'s visible in your current map view.',
    pos: { desk: [50, 93], mob: [50, 85] }
  },
  {
    icon: '🛰',
    title: 'Basemap Gallery',
    body: 'Switch between Esri street and topographic maps, or high-resolution NearMap aerial imagery — updated far more frequently than standard satellite views.',
    callout: '💡 NearMap is great for seeing recent construction, lot changes, or fine property-level detail that older imagery misses.',
    pos: { desk: [98, 20], mob: [90, 14] }
  },
];

function isMobile() { return window.innerWidth <= 600; }
function getRect()  { return document.getElementById('mapWrapper').getBoundingClientRect(); }

function positionBeacons() {
  const rect = getRect();
  const mobile = isMobile();
  stops.forEach((stop, i) => {
    const b = document.getElementById('b' + i);
    const pos = mobile ? stop.pos.mob : stop.pos.desk;
    if (!pos) { b.style.display = 'none'; return; }
    b.style.display = '';
    b.style.left = (pos[0] / 100 * rect.width)  + 'px';
    b.style.top  = (pos[1] / 100 * rect.height) + 'px';
  });
}

const ro = new ResizeObserver(() => { if (tourActive) positionBeacons(); });
ro.observe(document.getElementById('mapWrapper'));

window.addEventListener('load', () => {
  tourActive = true;
  document.getElementById('tourOverlay').classList.add('active');
  document.getElementById('introCard').classList.add('visible');
  document.getElementById('exitBtn').classList.add('visible');
});

function showBeacons() {
  document.getElementById('introCard').classList.remove('visible');
  positionBeacons();
  document.querySelectorAll('.beacon').forEach(b => b.classList.add('visible'));
}

function openTip(index) {
  currentTip = index;
  const stop = stops[index];
  const mobile = isMobile();
  const pos = mobile ? stop.pos.mob : stop.pos.desk;
  if (!pos) return;

  document.getElementById('tipIcon').textContent    = stop.icon;
  document.getElementById('tipTitle').textContent   = stop.title;
  document.getElementById('tipBody').textContent    = stop.body;
  document.getElementById('tipCallout').textContent = stop.callout;

  const visibleStops = stops.filter(s => mobile ? s.pos.mob : s.pos.desk);
  const visibleIndex = visibleStops.findIndex((s, i) => stops.indexOf(s) === index);
  document.getElementById('tipCounter').textContent = `${visibleIndex + 1} / ${visibleStops.length}`;
  document.getElementById('tipNext').textContent    = visibleIndex < visibleStops.length - 1 ? 'Next →' : 'Done ✓';

  const rect = getRect();
  const bx = pos[0] / 100 * rect.width;
  const by = pos[1] / 100 * rect.height;
  const tip = document.getElementById('tourTip');
  const tipW = mobile ? 252 : 290;
  const tipH = 235;

  let tx = bx + 44, ty = by - 70;
  if (tx + tipW > rect.width  - 10) tx = bx - tipW - 16;
  if (tx < 10) tx = 10;
  if (ty < 10) ty = by + 44;
  if (ty + tipH > rect.height - 70) ty = rect.height - tipH - 70;

  tip.style.left  = tx + 'px';
  tip.style.top   = ty + 'px';
  tip.style.width = tipW + 'px';
  tip.classList.add('visible');

  const hl = document.getElementById('hlRing');
  hl.style.left   = (bx - 23) + 'px';
  hl.style.top    = (by - 23) + 'px';
  hl.style.width  = '46px';
  hl.style.height = '46px';
  hl.classList.add('visible');
}

function closeTip() {
  document.getElementById('tourTip').classList.remove('visible');
  document.getElementById('hlRing').classList.remove('visible');
}

function nextTip() {
  const mobile = isMobile();
  let next = currentTip + 1;
  while (next < stops.length && mobile && !stops[next].pos.mob) next++;
  if (next < stops.length) openTip(next);
  else closeTip();
}

window.addEventListener('resize', () => { if (tourActive) positionBeacons(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeTip(); });
</script>
</body>
</html>
